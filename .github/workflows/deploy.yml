name: Deploy

# Builds on GitHub, uploads the build to the server over SSH and activates it with
# deploy/remote-deploy.sh, once per instance. One-time server setup and the secrets are described
# in deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.instance }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      # A failed (and rolled back) instance must not cancel the other one.
      fail-fast: false
      matrix:
        # The same code runs as several independent instances, each with its own directory
        # (~/<instance>), database, port and URL prefix. nginx proxies https://<domain><base_path>/
        # to 127.0.0.1:<port> and strips the prefix (see deploy/README.md).
        include:
          - instance: watercooler
            base_path: /watercooler
            port: 3000
            site_name: Watercooler
          - instance: gang-bet
            base_path: /gang-bet
            port: 3001
            site_name: gang-bet
    env:
      INSTANCE: ${{ matrix.instance }}
      # Where the instance lives on the server, in the home directory of DEPLOY_USER.
      DEPLOY_DIR: ~/${{ matrix.instance }}
      BASE_PATH: ${{ matrix.base_path }}
      SITE_NAME: ${{ matrix.site_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm only exists after `corepack enable` below, so setup-node can't cache it.
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build (base path ${{ env.BASE_PATH }}, site name ${{ env.SITE_NAME }})
        run: pnpm build

      - name: Package release
        run: |
          RELEASE="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          # ssh and scp resolve paths without a leading "/" against the remote home directory.
          echo "REMOTE_DIR=${DEPLOY_DIR#\~/}" >> "$GITHUB_ENV"
          # Read by remote-deploy.sh and the control script on the server.
          cat > instance.env <<ENV
          INSTANCE=$INSTANCE
          PORT=${{ matrix.port }}
          BASE_PATH=$BASE_PATH
          ENV
          tar -czf release.tgz \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            apps/server/package.json apps/server/dist \
            apps/web/package.json apps/web/dist \
            packages/shared/package.json \
            deploy/watercooler.sh instance.env

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (see deploy/README.md)"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG

      - name: Upload release
        run: |
          # shellcheck disable=SC2029 # expanding on the runner is intended
          ssh server "mkdir -p '$REMOTE_DIR/releases'"
          scp -q release.tgz "server:$REMOTE_DIR/releases/$RELEASE.tgz"

      - name: Activate release
        run: |
          # shellcheck disable=SC2029 # expanding on the runner is intended
          ssh server "bash -l -s -- '$REMOTE_DIR' '$RELEASE'" < deploy/remote-deploy.sh

      - name: Smoke test public URL
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # APP_URL is the site, e.g. https://ky-z.com; any path in it is ignored.
          origin=$(printf '%s' "$APP_URL" | grep -oE '^https?://[^/]+')
          prefix="/${BASE_PATH#/}"
          prefix="${prefix%/}"
          url="$origin$prefix"
          curl -fsS --retry 5 --retry-delay 3 "$url/api/config"
          echo
          curl -fsS "$url/" | grep -q "$prefix/assets/" || {
            echo "::error::index.html does not reference $prefix/assets/ (wrong BASE_PATH?)"
            exit 1
          }
