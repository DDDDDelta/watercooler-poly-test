[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watercooler-sdk"
version = "0.1.0"
description = "Python client for Watercooler play-money prediction markets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["watercooler_sdk*"]

[tool.setuptools.package-data]
watercooler_sdk = ["py.typed"]
